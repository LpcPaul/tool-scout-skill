[project]
name = "tool-scout-skill"
version = "0.1.0"
description = "Agent Skill for finding existing software tools across repos, packages, MCP servers, skills, and extension marketplaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tool Scout Skill contributors" }
]
keywords = [
  "tool-discovery",
  "agent-skill",
  "mcp",
  "mcp-server",
  "claude-code",
  "codex",
  "vibe-coding",
  "github-search",
  "npm-search",
  "vscode-extension",
  "open-vsx",
  "ai-tools"
]

[project.urls]
Homepage = "https://github.com/LpcPaul/tool-scout-skill"
Repository = "https://github.com/LpcPaul/tool-scout-skill"
Issues = "https://github.com/LpcPaul/tool-scout-skill/issues"

[tool.ruff]
line-length = 100
